<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roube o Ovo 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>
const cena=new THREE.Scene();
cena.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
camera.position.set(0,4,8);

const renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const luz=new THREE.HemisphereLight(0xffffff,0x444444,3);
cena.add(luz);

const chao=new THREE.Mesh(
 new THREE.BoxGeometry(30,1,30),
 new THREE.MeshStandardMaterial({color:0x55aa55})
);
chao.position.y=-.5;
cena.add(chao);

const boneco=new THREE.Mesh(
 new THREE.BoxGeometry(1,2,1),
 new THREE.MeshStandardMaterial({color:0x3366ff})
);
boneco.position.y=1;
cena.add(boneco);

function animar(){
 requestAnimationFrame(animar);
 camera.lookAt(boneco.position);
 renderer.render(cena,camera);
}
animar();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
