  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(0,0,0,.55);
  color: white;
  padding: 10px;
  border-radius: 10px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  margin: 3px;
  font-size: 15px;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
}

#camera {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 10;
}
</style>
</head>

  🥚 Roube o Ovo 3D<br>
  <span id="mode">3ª pessoa</span>
</div>

<div id="controls">
  <button id="up">⬆️</button><br>
  <button id="left">⬅️</button>
  <button id="down">⬇️</button>
  <button id="right">➡️</button>
</div>

<div id="camera">
  <button id="camBtn">🎥 1ª pessoa</button>
</div>

scene.add(sun);

const groundGeometry = new THREE.BoxGeometry(100, 1, 100);

  color: 0x55aa55
});

const ground = new THREE.Mesh(

  groundMaterial

ground.position.y = -0.5;

scene.add(player);

);

scene.add(egg);

  const house = new THREE.Mesh(

    new THREE.MeshStandardMaterial({color: 0xcc8844})
  );

  house.position.set(x, 2, z);
  scene.add(house);

  const roof = new THREE.Mesh(

  );

  roof.position.set(x, 5, z);
  roof.rotation.y = Math.PI / 4;
  scene.add(roof);
}
