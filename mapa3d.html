<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Roube o Ovo 3D</title>
<style>*{
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

button{
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb}
canvas{display:block}
#info{position:fixed;top:10px;left:10px;background:#0008;color:white;padding:10px;border-radius:10px;font-family:Arial}
#controles{position:fixed;bottom:20px;left:20px}
button{font-size:25px;margin:3px;padding:10px 15px;border:0;border-radius:10px}
</style>
</head>
<body>

<div id="info">🥚 Roube o Ovo 3D<br>🟦 Você</div>

<canvas id="jogo"></canvas>

<div id="controles">
<button onpointerdown="tecla('w',1)" onpointerup="tecla('w',0)">⬆️</button><br>
<button onpointerdown="tecla('a',1)" onpointerup="tecla('a',0)">⬅️</button>
<button onpointerdown="tecla('s',1)" onpointerup="tecla('s',0)">⬇️</button>
<button onpointerdown="tecla('d',1)" onpointerup="tecla('d',0)">➡️</button>
</div>

<script>
const c=document.getElementById("jogo");
const ctx=c.getContext("2d");

function tamanho(){
 c.width=innerWidth;
 c.height=innerHeight;
}
tamanho();
addEventListener("resize",tamanho);

let x=0,z=0;
let keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);

function tecla(k,v){keys[k]=v}

function desenhar(){
 x+=(keys.d?0.08:0)-(keys.a?0.08:0);
 z+=(keys.s?0.08:0)-(keys.w?0.08:0);

 ctx.clearRect(0,0,c.width,c.height);

 // céu
 ctx.fillStyle="#87ceeb";
 ctx.fillRect(0,0,c.width,c.height);

 // chão
 ctx.fillStyle="#55aa55";
 ctx.fillRect(0,c.height/2,c.width,c.height/2);

 // casas
 casa(150,300);
 casa(c.width-150,350);

 // árvores
 arvore(100,180);
 arvore(c.width-100,220);

 // ovo
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.ellipse(c.width/2+150-x*20,c.height/2-30+z*20,25,35,0,0,Math.PI*2);
 ctx.fill();

 // jogador
 ctx.fillStyle="#3366ff";
 ctx.fillRect(c.width/2-25,c.height/2-50,50,70);

 requestAnimationFrame(desenhar);
}

function casa(px,py){
 ctx.fillStyle="#cc8844";
 ctx.fillRect(px-45,py-60,90,60);
 ctx.fillStyle="#aa3333";
 ctx.beginPath();
 ctx.moveTo(px-60,py-60);
 ctx.lineTo(px,py-110);
 ctx.lineTo(px+60,py-60);
 ctx.fill();
}

function arvore(px,py){
 ctx.fillStyle="#8b4513";
 ctx.fillRect(px-10,py,20,70);
 ctx.fillStyle="#228b22";
 ctx.beginPath();
 ctx.arc(px,py,45,0,Math.PI*2);
 ctx.fill();
}

desenhar();
</script>
</body>
</html>
